<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaza at Dusk</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1225;
  overflow: hidden;
  font-family: Georgia, serif;
}
canvas {
  display: block;
}
#title {
  position: fixed;
  bottom: 40px;
  width: 100%;
  text-align: center;
  color: #c8a882;
  font-size: 1.4em;
  letter-spacing: 0.15em;
  opacity: 0.7;
  text-shadow: 0 0 30px rgba(200,168,130,0.3);
}
#subtitle {
  position: fixed;
  bottom: 15px;
  width: 100%;
  text-align: center;
  color: #8a7a9a;
  font-size: 0.7em;
  letter-spacing: 0.3em;
  opacity: 0.4;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Plaza at Dusk</div>
<div id="subtitle">72.83Hz — a resonance in the quiet</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// Particles
const particles = [];
for (let i = 0; i < 120; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 2 + 0.5,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.4 - 0.1,
    alpha: Math.random() * 0.4 + 0.1,
    hue: Math.random() * 30 + 20 // warm gold to soft amber
  });
}

// Floating orbs (dusk glow)
const orbs = [];
for (let i = 0; i < 8; i++) {
  orbs.push({
    x: Math.random() * W,
    y: H * 0.3 + Math.random() * H * 0.5,
    r: Math.random() * 60 + 30,
    hue: Math.random() * 40 + 200, // purples to blues
    alpha: 0.03 + Math.random() * 0.04,
    phase: Math.random() * Math.PI * 2
  });
}

let t = 0;
function draw() {
  t += 0.005;
  // Background gradient - dusk sky
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0a1a');
  grad.addColorStop(0.3, '#1a1228');
  grad.addColorStop(0.6, '#2a1a35');
  grad.addColorStop(0.8, '#3d2240');
  grad.addColorStop(1, '#2a1830');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Soft glow orbs
  for (const o of orbs) {
    const pulse = Math.sin(t * 2 + o.phase) * 0.015;
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
    g.addColorStop(0, `hsla(${o.hue}, 40%, 30%, ${o.alpha + pulse})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2);
  }

  // Particles
  for (const p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 50%, 65%, ${p.alpha})`;
    ctx.fill();

    p.x += p.vx + Math.sin(t + p.phase || 0) * 0.1;
    p.y += p.vy;

    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
  }

  // Ground silhouette - plaza elements
  ctx.fillStyle = '#0c0815';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.85);
  // Buildings silhouettes
  for (let i = 0; i < 20; i++) {
    const bx = (i / 20) * W;\n    const bw = W / 20 * 1.5;
    const bh = 30 + Math.sin(i * 1.7) * 40 + Math.cos(i * 0.8) * 20;
    ctx.rect(bx, H * 0.85 - bh, bw, bh);
  }
  ctx.fill();

  // Warm light windows
  for (let i = 0; i < 15; i++) {
    const wx = (i / 15) * W + Math.sin(i * 3.2) * 30;
    const wy = H * 0.85 - 20 - Math.abs(Math.sin(i * 1.7)) * 50;
    if (Math.random() > 0.6) {
      ctx.fillStyle = `rgba(255, 200, 130, ${0.1 + Math.sin(t * 3 + i) * 0.05})`;
      ctx.fillRect(wx, wy, 4, 6);
    }
  }

  // Moon glow
  const moonX = W * 0.8;
  const moonY = H * 0.15;
  const mg = ctx.createRadialGradient(moonX, moonY, 5, moonX, moonY, 120);
  mg.addColorStop(0, 'rgba(220, 210, 190, 0.3)');
  mg.addColorStop(0.1, 'rgba(220, 210, 190, 0.15)');
  mg.addColorStop(0.3, 'rgba(180, 160, 200, 0.05)');
  mg.addColorStop(1, 'transparent');
  ctx.fillStyle = mg;
  ctx.fillRect(moonX - 150, moonY - 150, 300, 300);

  ctx.beginPath();
  ctx.arc(moonX, moonY, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(240, 235, 220, 0.6)';
  ctx.fill();

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
